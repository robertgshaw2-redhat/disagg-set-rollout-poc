# One *version* of the DeepSeek-V2-Lite P/D stack: a prefill role and a decode
# role managed as a single DisaggregatedSet. The v0/ and v1/ overlays stamp this
# into two independent objects (dsv2-v0, dsv2-v1) so a rollout can be driven by
# hand -- each version's replica counts are patched separately -- instead of by
# the controller's automatic rolling update.
#
# Every replica is one pod with 2 GPUs running DP=2/TP=1 with expert parallelism
# over the allgather/reducescatter all2all. vLLM runs one API server per DP rank
# (--data-parallel-multi-port-external-lb), so the pod exposes a port per rank
# and the EPP load-balances over (pod, rank) rather than over pods:
#
#            pool ports        vLLM ranks
#   prefill  8000, 8001   ==   8000, 8001
#   decode   8000, 8001   ->   8200, 8201   (routing-proxy sidecar in between)
#
# What makes the two objects one fleet to the router:
#   llm-d.ai/guide: dsv2-rollout         the InferencePool selector AND the
#                                        rollout screener's scope
#   disaggregatedset.x-k8s.io/revision   stamped by the controller, differs per
#                                        object; the screener never pairs a
#                                        prefill and a decode across it
#
# Draining (see README "Draining"):
#   preStop sleep       pod is already out of the pool; keeps vLLM fully up while
#                       the EPP's view converges and decodes finish pulling KV
#   --shutdown-timeout  on SIGTERM, finish in-flight requests instead of aborting
#   terminationGracePeriodSeconds > preStop + shutdown-timeout
apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  name: dsv2
  labels:
    llm-d.ai/guide: dsv2-rollout
    llm-d.ai/model: DeepSeek-V2-Lite
spec:
  roles:
    # ------------------------------------------------------------- prefill
    - name: prefill
      spec:
        replicas: 0
        startupPolicy: LeaderCreated
        leaderWorkerTemplate:
          size: 1
          restartPolicy: RecreateGroupOnPodRestart
          workerTemplate:
            metadata:
              labels:
                llm-d.ai/guide: dsv2-rollout
                llm-d.ai/model: DeepSeek-V2-Lite
                llm-d.ai/role: prefill
                llm-d.ai/inference-serving: "true"
                rollout.poc/version: REPLACE_VERSION
            spec:
              terminationGracePeriodSeconds: 150
              tolerations:
                - key: is_gpu
                  operator: Exists
                  effect: PreferNoSchedule
              containers:
                - name: vllm
                  image: docker.io/vllm/vllm-openai@sha256:dea7fa047caa114167efccdeb42321b12d2c11da1add8728aa2662cb8d6b8cd5 # nightly 2026-09-18
                  imagePullPolicy: IfNotPresent
                  securityContext:
                    capabilities:
                      add: [IPC_LOCK, SYS_RAWIO]
                    runAsGroup: 0
                    runAsUser: 0
                  command: ["/bin/bash", "-c"]
                  args:
                    - |-
                      set -euo pipefail
                      echo "rollout version: ${ROLLOUT_VERSION}"
                      python3 -c "import nixl" 2>/dev/null || uv pip install --system nixl nixl-cu13

                      exec vllm serve "${MODEL}" \
                        --port 8000 \
                        --trust-remote-code \
                        --disable-access-log-for-endpoints=/health,/metrics,/v1/models \
                        --max-model-len 8192 \
                        --max-num-seqs "${MAX_NUM_SEQS}" \
                        --gpu-memory-utilization 0.6 \
                        --tensor-parallel-size 1 \
                        --data-parallel-size "${DP_SIZE}" \
                        --data-parallel-size-local "${DP_SIZE}" \
                        --data-parallel-multi-port-external-lb \
                        --data-parallel-supervisor-port 8008 \
                        --enable-expert-parallel \
                        --all2all-backend allgather_reducescatter \
                        --enforce-eager \
                        --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail"}' \
                        --shutdown-timeout "${SHUTDOWN_TIMEOUT}"
                  env:
                    # The version-specific knobs come first: the overlays patch
                    # them by index (guarded by `op: test`).
                    - name: ROLLOUT_VERSION
                      value: REPLACE_VERSION
                    - name: MAX_NUM_SEQS
                      value: "64"
                    - name: MODEL
                      value: deepseek-ai/DeepSeek-V2-Lite
                    - name: DP_SIZE
                      value: "2"
                    - name: SHUTDOWN_TIMEOUT
                      value: "90"
                    - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    - name: HF_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: llm-d-hf-token
                          key: HF_TOKEN
                    - name: HF_HUB_CACHE
                      value: /var/cache/huggingface
                    - name: VLLM_CACHE_ROOT
                      value: /var/cache/vllm/vllm
                    - name: FLASHINFER_WORKSPACE_BASE
                      value: /var/cache/vllm/flashinfer
                    - name: CUDA_CACHE_PATH
                      value: /var/cache/vllm/cuda
                    - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
                      value: "120"
                    - name: NCCL_IB_HCA
                      value: ibp
                  ports:
                    - {name: rank0, containerPort: 8000, protocol: TCP}
                    - {name: rank1, containerPort: 8001, protocol: TCP}
                    - {name: supervisor, containerPort: 8008, protocol: TCP}
                  lifecycle:
                    preStop:
                      sleep:
                        seconds: 20
                  resources:
                    requests:
                      cpu: "16"
                      memory: 128Gi
                      nvidia.com/gpu: "2"
                      rdma/ib: "1"
                    limits:
                      memory: 128Gi
                      nvidia.com/gpu: "2"
                      rdma/ib: "1"
                  startupProbe:
                    httpGet: {path: /health, port: supervisor}
                    periodSeconds: 2
                    timeoutSeconds: 5
                    failureThreshold: 1350
                  readinessProbe:
                    httpGet: {path: /readyz, port: supervisor}
                    periodSeconds: 5
                    timeoutSeconds: 5
                    failureThreshold: 3
                  livenessProbe:
                    httpGet: {path: /health, port: supervisor}
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 3
                  volumeMounts:
                    - {name: dshm, mountPath: /dev/shm}
                    - {name: hf-cache, mountPath: /var/cache/huggingface}
                    - {name: jit-cache, mountPath: /var/cache/vllm}
              volumes:
                - name: dshm
                  emptyDir: {medium: Memory, sizeLimit: 8Gi}
                # CoreWeave node-local NVMe: weights and JIT kernels are paid for
                # once per node, not once per pod.
                - name: hf-cache
                  hostPath: {path: /mnt/local/hf-cache, type: DirectoryOrCreate}
                - name: jit-cache
                  hostPath: {path: /mnt/local/jit-cache, type: DirectoryOrCreate}

    # -------------------------------------------------------------- decode
    - name: decode
      spec:
        replicas: 0
        startupPolicy: LeaderCreated
        leaderWorkerTemplate:
          size: 1
          restartPolicy: RecreateGroupOnPodRestart
          workerTemplate:
            metadata:
              labels:
                llm-d.ai/guide: dsv2-rollout
                llm-d.ai/model: DeepSeek-V2-Lite
                llm-d.ai/role: decode
                llm-d.ai/inference-serving: "true"
                rollout.poc/version: REPLACE_VERSION
            spec:
              terminationGracePeriodSeconds: 150
              tolerations:
                - key: is_gpu
                  operator: Exists
                  effect: PreferNoSchedule
              # Native sidecar: owns 8000-8001 (what the pool routes to), runs the
              # prompt on the EPP-chosen prefill rank, then hands off to local vLLM
              # rank N on 8200+N. Being a native sidecar it outlives the vllm
              # container on termination, so draining requests keep their proxy.
              # Log level 4 prints one "sending prefill request" line per request,
              # which is what pairing.py reads.
              initContainers:
                - name: routing-proxy
                  image: ghcr.io/llm-d/llm-d-router-disagg-sidecar:v0.10.0
                  imagePullPolicy: IfNotPresent
                  restartPolicy: Always
                  args:
                    - --port=8000
                    - --vllm-port=8200
                    - --data-parallel-size=2
                    - --kv-connector=nixlv2
                    - --zap-log-level=4
                    - --secure-proxy=false
                  ports:
                    - {name: rank0, containerPort: 8000, protocol: TCP}
                    - {name: rank1, containerPort: 8001, protocol: TCP}
                  resources: {}
                  securityContext:
                    allowPrivilegeEscalation: false
                    runAsNonRoot: true
              containers:
                - name: vllm
                  image: docker.io/vllm/vllm-openai@sha256:dea7fa047caa114167efccdeb42321b12d2c11da1add8728aa2662cb8d6b8cd5 # nightly 2026-09-18
                  imagePullPolicy: IfNotPresent
                  securityContext:
                    capabilities:
                      add: [IPC_LOCK, SYS_RAWIO]
                    runAsGroup: 0
                    runAsUser: 0
                  command: ["/bin/bash", "-c"]
                  args:
                    - |-
                      set -euo pipefail
                      echo "rollout version: ${ROLLOUT_VERSION}"
                      python3 -c "import nixl" 2>/dev/null || uv pip install --system nixl nixl-cu13

                      exec vllm serve "${MODEL}" \
                        --port 8200 \
                        --trust-remote-code \
                        --disable-access-log-for-endpoints=/health,/metrics,/v1/models \
                        --max-model-len 8192 \
                        --max-num-seqs "${MAX_NUM_SEQS}" \
                        --gpu-memory-utilization 0.6 \
                        --tensor-parallel-size 1 \
                        --data-parallel-size "${DP_SIZE}" \
                        --data-parallel-size-local "${DP_SIZE}" \
                        --data-parallel-multi-port-external-lb \
                        --data-parallel-supervisor-port 8208 \
                        --enable-expert-parallel \
                        --all2all-backend allgather_reducescatter \
                        --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail"}' \
                        --shutdown-timeout "${SHUTDOWN_TIMEOUT}"
                  env:
                    - name: ROLLOUT_VERSION
                      value: REPLACE_VERSION
                    - name: MAX_NUM_SEQS
                      value: "64"
                    - name: MODEL
                      value: deepseek-ai/DeepSeek-V2-Lite
                    - name: DP_SIZE
                      value: "2"
                    - name: SHUTDOWN_TIMEOUT
                      value: "90"
                    - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    - name: HF_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: llm-d-hf-token
                          key: HF_TOKEN
                    - name: HF_HUB_CACHE
                      value: /var/cache/huggingface
                    - name: VLLM_CACHE_ROOT
                      value: /var/cache/vllm/vllm
                    - name: FLASHINFER_WORKSPACE_BASE
                      value: /var/cache/vllm/flashinfer
                    - name: CUDA_CACHE_PATH
                      value: /var/cache/vllm/cuda
                    - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
                      value: "120"
                    - name: NCCL_IB_HCA
                      value: ibp
                  ports:
                    - {name: vllm-rank0, containerPort: 8200, protocol: TCP}
                    - {name: vllm-rank1, containerPort: 8201, protocol: TCP}
                    - {name: supervisor, containerPort: 8208, protocol: TCP}
                  lifecycle:
                    preStop:
                      sleep:
                        seconds: 20
                  resources:
                    requests:
                      cpu: "16"
                      memory: 128Gi
                      nvidia.com/gpu: "2"
                      rdma/ib: "1"
                    limits:
                      memory: 128Gi
                      nvidia.com/gpu: "2"
                      rdma/ib: "1"
                  startupProbe:
                    httpGet: {path: /health, port: supervisor}
                    periodSeconds: 2
                    timeoutSeconds: 5
                    failureThreshold: 1350
                  readinessProbe:
                    httpGet: {path: /readyz, port: supervisor}
                    periodSeconds: 5
                    timeoutSeconds: 5
                    failureThreshold: 3
                  livenessProbe:
                    httpGet: {path: /health, port: supervisor}
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 3
                  volumeMounts:
                    - {name: dshm, mountPath: /dev/shm}
                    - {name: hf-cache, mountPath: /var/cache/huggingface}
                    - {name: jit-cache, mountPath: /var/cache/vllm}
              volumes:
                - name: dshm
                  emptyDir: {medium: Memory, sizeLimit: 8Gi}
                - name: hf-cache
                  hostPath: {path: /mnt/local/hf-cache, type: DirectoryOrCreate}
                - name: jit-cache
                  hostPath: {path: /mnt/local/jit-cache, type: DirectoryOrCreate}
